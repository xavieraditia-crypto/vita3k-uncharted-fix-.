name: Build Vita3K APK From Zip

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Code and Move Files
        run: |
          unzip -o *.zip
          rm *.zip
          FOLDER_NAME=$(ls -d */ | grep -E 'Vita3K|minimal|fix' | head -n 1)
          if [ -n "$FOLDER_NAME" ]; then
            echo "Memindahkan file dari folder: $FOLDER_NAME"
            cp -r "$FOLDER_NAME".* . 2>/dev/null || true
            cp -r "$FOLDER_NAME"* . 2>/dev/null || true
            rm -rf "$FOLDER_NAME"
          fi

      - name: Install Android NDK, CMake & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build APK with Gradle & Vcpkg
        run: |
          chmod +x android/gradlew || chmod +x gradlew || true
          
          # Mendeteksi letak vcpkg bawaan di dalam server virtual runner GitHub
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          echo "VCPKG_ROOT diset ke: $VCPKG_ROOT"
          
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleRelease
          else
            ./gradlew assembleRelease
          fi
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-Uncharted-Fix-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
            
