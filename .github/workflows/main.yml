name: Build Vita3K APK From Zip

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-28"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;29.0.14206865"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip ninja-build

      - name: Setup vcpkg
        shell: bash
        run: |
          if [ -d "/usr/local/share/vcpkg" ]; then
            echo "VCPKG_ROOT=/usr/local/share/vcpkg" >> "$GITHUB_ENV"
          elif [ -d "$VCPKG_INSTALLATION_ROOT" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            echo "ERROR: vcpkg tidak ditemukan."
            exit 1
          fi

      - name: Extract Vita3K ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP Vita3K tidak ditemukan."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Isi ZIP:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android Project
        shell: bash
        run: |
          ANDROID_DIR=$(find extracted -type f -name "gradlew" -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: gradlew tidak ditemukan di dalam ZIP."
            exit 1
          fi

          echo "Android project ditemukan di: $ANDROID_DIR"
          echo "ANDROID_PROJECT=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Prepare Environment
        shell: bash
        run: |
          chmod +x "$ANDROID_PROJECT/gradlew"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          echo "VCPKG_ROOT=$VCPKG_ROOT"

          test -d "$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          test -d "$VCPKG_ROOT"

      - name: Build Release APK
        shell: bash
        env:
          VCPKG_FORCE_SYSTEM_BINARIES: "1"
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export VCPKG_ROOT="$VCPKG_ROOT"

          export PATH="$ANDROID_SDK_ROOT/cmake/3.22.1/bin:$ANDROID_NDK_HOME:$PATH"

          cd "$ANDROID_PROJECT"

          ./gradlew clean assembleRelease \
            -Pandroid.ndkVersion=29.0.14206865 \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK yang berhasil dibuat:"
          find . -type f -path "*/build/outputs/apk/*/*.apk" -print

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-Uncharted-Fix-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
